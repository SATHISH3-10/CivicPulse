<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#4B5563"/>
  <!-- Fresh smooth asphalt patch -->
  <ellipse cx="300" cy="220" rx="150" ry="75" fill="#1F2937" stroke="#10B981" stroke-width="4"/>
  <!-- Road markings newly painted -->
  <line x1="0" y1="200" x2="600" y2="200" stroke="#FBBF24" stroke-width="8" stroke-dasharray="30 20"/>
  <!-- Success badge -->
  <rect x="20" y="20" width="190" height="44" rx="8" fill="#059669"/>
  <text x="115" y="48" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">✅ RESOLVED BY OFFICER</text>
</svg>
