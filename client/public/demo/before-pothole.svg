<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#374151"/>
  <!-- Road markings -->
  <line x1="0" y1="200" x2="600" y2="200" stroke="#F59E0B" stroke-width="8" stroke-dasharray="30 20"/>
  <!-- Pothole crater -->
  <ellipse cx="300" cy="220" rx="140" ry="70" fill="#1F2937" stroke="#111827" stroke-width="6"/>
  <ellipse cx="290" cy="225" rx="100" ry="45" fill="#030712"/>
  <!-- Cracks -->
  <path d="M160 220 L110 240 M440 220 L490 200 M300 150 L280 100 M320 290 L350 340" stroke="#111827" stroke-width="4" fill="none"/>
  <!-- Hazard warning badge -->
  <rect x="20" y="20" width="180" height="44" rx="8" fill="#DC2626"/>
  <text x="110" y="48" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">⚠️ REPORTED ISSUE</text>
</svg>
