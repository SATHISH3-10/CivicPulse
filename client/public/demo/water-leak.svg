<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#334155"/>
  <!-- Pavement -->
  <rect x="0" y="240" width="600" height="160" fill="#475569"/>
  <!-- Burst Pipe underground -->
  <rect x="180" y="270" width="240" height="28" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="3"/>
  <circle cx="280" cy="284" r="12" fill="#ef4444"/>
  <!-- Water geyser / gushing stream -->
  <path d="M280 270 Q270 120 290 80 Q310 120 300 270 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M260 270 Q240 160 270 110 Q290 160 280 270 Z" fill="#bae6fd" opacity="0.6"/>
  <!-- Water puddles on road -->
  <ellipse cx="300" cy="340" rx="180" ry="40" fill="#0284c7" opacity="0.7"/>
  <ellipse cx="280" cy="345" rx="130" ry="25" fill="#38bdf8" opacity="0.8"/>
  <!-- Warning badge -->
  <rect x="20" y="20" width="200" height="42" rx="8" fill="#0284c7"/>
  <text x="120" y="47" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">💧 WATER PIPELINE LEAK</text>
</svg>
